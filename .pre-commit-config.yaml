repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.15.6
    hooks:
    - id: ruff          # used by `fix`
      alias: ruff-fix
      args: [--fix]
    - id: ruff          # used by `lint`
      alias: ruff-lint
    - id: ruff-format   # replaces black
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: [--ignore-words=docs/codespell-ignore-words.txt]
